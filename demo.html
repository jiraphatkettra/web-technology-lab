<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตัวอย่าง Tailwind แบบง่ายๆ (Beginner Guide)</title>
    <!-- เชื่อมต่อ Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 p-8 flex flex-col items-center gap-8 min-h-screen">

    <div class="text-center space-y-2">
        <h1 class="text-3xl font-bold text-slate-800">เรียน Tailwind CSS แบบง่ายๆ</h1>
        <p class="text-slate-500 text-sm">รวม 4 ตัวอย่างองค์ประกอบที่ใช้บ่อยในชีวิตจริง</p>
    </div>

    <!-- ตัวอย่างที่ 1: การสร้างปุ่ม (Buttons) -->
    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md space-y-4">
        <h2 class="font-semibold text-slate-700 border-b pb-2">1. ปุ่มกด (Buttons)</h2>
        <div class="flex gap-3">
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
                ปุ่มหลัก
            </button>
            <button class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-medium transition">
                ปุ่มรอง
            </button>
        </div>
    </div>

    <!-- ตัวอย่างที่ 2: การสร้างการ์ดสินค้า / ข้อความ (Card) -->
    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md space-y-3">
        <h2 class="font-semibold text-slate-700 border-b pb-2">2. การ์ด (Card)</h2>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2.5 py-1 rounded-full">สินค้าแนะนำ</span>
            <h3 class="text-lg font-bold text-slate-800 mt-2">หูฟังไร้สาย Pro</h3>
            <p class="text-slate-500 text-sm mt-1">เสียงดี เบสหนัก แบตเตอรี่ยาวนาน 24 ชั่วโมง</p>
            <p class="text-xl font-extrabold text-emerald-600 mt-3">฿1,590</p>
        </div>
    </div>

    <!-- ตัวอย่างที่ 3: การสร้าง Profile Badge (Flexbox layout) -->
    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md space-y-3">
        <h2 class="font-semibold text-slate-700 border-b pb-2">3. โปรไฟล์ (Flex Alignment)</h2>
        <div class="flex items-center gap-4">
            <div
                class="w-12 h-12 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-lg">
                JP
            </div>
            <div>
                <h4 class="font-bold text-slate-800">Jirapat</h4>
                <p class="text-slate-400 text-xs">Web Developer</p>
            </div>
        </div>
    </div>

</body>

</html>
